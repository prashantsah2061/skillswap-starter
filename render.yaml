# Deploy from the repository root: npm workspaces share the root lockfile.
# Configure these values in Render, never in this file or in GitHub.
services:
  - type: web
    name: skillswap
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build:frontend
    startCommand: npm run start --workspace @skillswap/frontend -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
